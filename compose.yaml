  #     './app:/code/app'
  #   env_file:
  #     - .env
  #   depends_on:
  #     - mysql
  #     - minio
  #   restart: always

  mysql:
    image: mysql:latest
    restart: always
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD:-secret}'
      MYSQL_DATABASE: '${DB_NAME}'
      MYSQL_USER: '${DB_USER}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
    volumes:
      - 'mysql_data:/var/lib/mysql'
    networks:
      - private

  minio:
    image: minio/minio:latest
    ports:
      - '9000:9000'
      - '8900:8900'
    environment:
      MINIO_ROOT_USER: '${MINIO_ACCESS_KEY}'
      MINIO_ROOT_PASSWORD: '${MINIO_SECRET_KEY}'
    volumes:
      - 'minio:/data'
    networks:
      - private
    command: 'minio server /data --console-address ":8900"'
    healthcheck:
      test:
          - CMD
          - mc
          - ready
          - local
      retries: 3
      timeout: 5s

networks:
  private:
    driver: bridge

volumes:
  minio:
    driver: local
  mysql_data:
    driver: local
